workflow:
  name: "siat"
  description: "SDD 프레임워크 - 문서 기반 워크플로우"

  # 시스템에서 사용 가능한 스텝들 (순서대로)
  steps:
    - clarify        # 분석 및 명확화
    - reproduce      # bugfix: 버그 재현
    - root-cause     # bugfix: 원인 분석
    - spec           # 요구사항 정의
    - design         # 기술 설계
    - visual-design  # UI/UX 시각 설계
    - implement      # 구현
    - fix            # bugfix: 버그 수정
    - verify         # 검증

output:
  path: ".claude/siat/specs"

execution:
  mode: "manual"  # "manual" | "auto"

hooks:
  pre-step: []
  post-step: []
  post-workflow: []
