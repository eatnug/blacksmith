workflow:
  name: "blacksmith"
  description: "Blacksmith 레포 워크플로우 + SDD best practice"

  steps:
    - clarify        # 분석 및 명확화
    - reproduce      # bugfix: 버그 재현
    - root-cause     # bugfix: 원인 분석
    - prd            # 요구사항 정의 (Product Requirements Document)
    - design         # 기술 설계
    - visual-design  # UI/UX 시각 설계
    - implement      # 구현
    - fix            # bugfix: 버그 수정
    - verify         # 검증

output:
  path: ".claude/siat/specs"

execution:
  mode: "manual"

hooks:
  pre-step: []
  post-step: []
