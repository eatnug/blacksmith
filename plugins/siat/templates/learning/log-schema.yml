# Workflow Log Schema
# 각 워크플로우 완료 시 생성되는 로그 파일의 스키마

schema_version: "1.0"

fields:
  # 식별 정보
  id:
    type: string
    format: "{date}-{task-slug}"
    example: "2024-01-10-cart-quantity"
    required: true

  task:
    type: string
    description: "태스크 요약 (한 줄)"
    required: true

  template:
    type: string
    enum: [feature, bugfix, ui, refactor]
    required: true

  # 시간 정보
  timing:
    started:
      type: datetime
      format: "ISO 8601"
    completed:
      type: datetime
      format: "ISO 8601"
    total_duration:
      type: string
      format: "{N}h {N}m"

  # 단계별 정보
  steps:
    type: array
    items:
      name:
        type: string
        description: "단계 이름"
      iterations:
        type: integer
        description: "반복 횟수 (1이면 재작업 없음)"
        default: 1
      duration:
        type: string
      blockers:
        type: array
        items:
          type: string
        description: "막혔던 부분"
      notes:
        type: string
        nullable: true

  # 결과 정보
  result:
    rating:
      type: integer
      min: 1
      max: 5
      description: "사용자 만족도"
    feedback:
      type: string
      description: "사용자 피드백"
    rework_steps:
      type: array
      items:
        type: string
      description: "재작업이 필요했던 단계"
    tags:
      type: array
      items:
        type: string
      description: "관련 태그 (도메인, 기술 등)"

  # 학습 관련
  knowledge_updated:
    type: array
    items:
      path:
        type: string
        description: "업데이트된 knowledge 파일 경로"
      added:
        type: array
        items:
          type: string
        description: "추가된 내용 요약"

  # 개선 제안
  suggestions:
    type: array
    items:
      id:
        type: string
      target:
        type: string
        description: "수정 대상 파일"
      type:
        type: string
        enum: [add-checklist, modify-prompt, add-example, other]
      reason:
        type: string
      content:
        type: string
      status:
        type: string
        enum: [pending, applied, rejected]

# 예시 로그
example: |
  id: "2024-01-10-cart-quantity"
  task: "장바구니 수량 변경 기능"
  template: feature

  timing:
    started: "2024-01-10T10:30:00+09:00"
    completed: "2024-01-10T14:20:00+09:00"
    total_duration: "3h 50m"

  steps:
    - name: clarify
      iterations: 1
      duration: "15m"
      blockers: []
      notes: null
    - name: spec
      iterations: 1
      duration: "30m"
      blockers: []
      notes: null
    - name: design
      iterations: 2
      duration: "1h 20m"
      blockers:
        - "상태 관리 방식 결정 필요"
      notes: "Zustand 사용, optimistic update 적용"
    - name: implement
      iterations: 1
      duration: "2h"
      blockers: []
      notes: null

  result:
    rating: 4
    feedback: "design에서 상태 관리 논의가 처음에 부족했음"
    rework_steps: [design]
    tags: [cart, state-management, zustand]

  knowledge_updated:
    - path: ".claude/knowledge/domains/cart.md"
      added:
        - "수량 변경 로직: optimistic update + 디바운스 500ms"
        - "상태 관리: Zustand store 사용"

  suggestions:
    - id: "design-state-management-checklist"
      target: "steps/design/instruction.md"
      type: "add-checklist"
      reason: "design 단계에서 상태 관리 누락 3회 반복"
      content: |
        ### 상태 관리 검토
        - [ ] 어떤 상태가 필요한가?
        - [ ] 로컬 vs 전역?
        - [ ] 서버 동기화 필요?
      status: "pending"
