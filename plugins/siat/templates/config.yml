# Siat Configuration
# Universal SDD 구현체

# 워크플로우 스텝 정의
steps:
  - specify    # 유저가 원하는 것 명확히
  - plan       # 구현/수정 계획
  - implement  # 실행
  - review     # 검증

# 출력 경로
output:
  path: ".claude/siat/specs"

# Gateway: 사용자 상호작용 채널
gateway:
  questions: local    # local = AskUserQuestion, script:xxx.sh
  feedback: local     # local = AskUserQuestion, script:xxx.sh

# Hooks: 워크플로우 확장 포인트
hooks:
  pre_step: []
  on_processed: []
  on_approve: []
  on_reject: []
  on_revise: []
  on_complete: []

# Presets: 자주 쓰는 설정 묶음
presets:
  remote:
    gateway:
      questions: script:gh-poll.sh {spec_path} --type=questions
      feedback: script:gh-poll.sh {spec_path} --type=feedback
    hooks:
      on_processed:
        - script:gh-issue.sh {spec_path}
        - script:slack-notify.sh {spec_path}
      on_approve:
        - script:gh-issue-close.sh {spec_path}
